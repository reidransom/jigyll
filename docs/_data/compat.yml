# Compatibility metadata — the single source of truth for how each docs page
# differs from Ruby Jekyll. Keyed by the page's slug (its file basename, or an
# explicit `compat_key` in the page's front matter).
#
# Feeds three surfaces:
#   1. the per-page callout   (_includes/compat_callout.html, via _layouts/docs.html)
#   2. the sidebar badge      (_includes/navigation.html)
#   3. the aggregate page     (_docs/differences.md)
#
# status vocabulary:
#   same        — behavior matches Jekyll; no callout (default; omit the entry)
#   modified    — mostly the same, with specific differences
#   replaced    — the whole topic works differently in jigyll
#   unsupported — Jekyll has it, jigyll doesn't
#   jigyll-only — jigyll adds something Jekyll lacks

index:
  status: modified
  summary: "Jigyll is a partially-compatible clone of Jekyll written in Go.
            Most Jekyll concepts carry over, but not every feature is
            implemented — pages that differ are flagged like this one."
  details: /docs/differences/

installation:
  status: replaced
  summary: "Jigyll ships as a single Go binary — install via Homebrew, Scoop,
            Docker, or the install script, not RubyGems/Bundler. There is no
            Ruby toolchain to set up."
  details: /docs/differences/#replaced

usage:
  status: replaced
  summary: "`new` creates a blank site directly; its themed form requires a
            Git URL. There are no `doctor` or `import` commands. Jigyll adds
            `plugins`, `render`, `routes`, `variables`, and `benchmark`.
            `serve` renders in memory (nothing is written to disk) and live
            reload is always on."
  details: /docs/differences/#replaced

configuration:
  status: modified
  summary: "A wrong YAML type for a supported key is a build error. `markdown:`,
            `liquid:`, and most `sass:` and `kramdown:` options are ignored —
            only kramdown's `toc_levels` is honored. Front-matter defaults match
            by path prefix, not glob. Caches live in `/tmp/jigyll-$USER`, not
            `./.sass-cache`."

rendering-process:
  status: modified
  summary: "Markdown is rendered by goldmark, not kramdown: raw `<`/`>` is
            treated as HTML, header IDs are generated differently, and there
            are no smart quotes. Kramdown's `{:toc}`, `$$` math (passed through
            for MathJax/KaTeX), heading attribute lists, and `markdown=\"1\"`
            blocks are supported; standalone ALDs are not."

posts:
  status: modified
  summary: "Categories and tags come only from front matter — the singular
            `category:`/`tag:` keys and directory-based categories are
            ignored. `--future` keys off the filename date, and
            `excerpt_separator` is global-only."

front-matter:
  status: modified
  summary: "Malformed YAML always fails the build (`strict_front_matter` is
            ignored), and files without front matter are copied as static
            files unless the `jekyll-optional-front-matter` plugin is on.
            Defaults scopes match by path prefix, not glob."

collections:
  status: modified
  summary: "`collections_dir` and custom sorting (`sort_by`, `order`) are not
            supported — collection folders live at the source root, and only
            `posts` is sorted (by date). Everything else works like Jekyll."

datafiles:
  status: modified
  summary: "Reads `.yml`/`.yaml`/`.json`/`.csv` files in `_data`, including
            namespaced subfolders — but no TSV. CSV parses into rows of
            strings, not header-keyed maps."

assets:
  status: modified
  summary: "Sass entrypoints run through Liquid like Jekyll, but output is
            always compressed and only `sass_dir` is supported. Source maps,
            extra load paths, Sass warning and deprecation controls, and
            CoffeeScript compilation are unavailable."
  comparison:
    - behavior: "Output style"
      jigyll: "Always compressed"
      jekyll: "`expanded` by default; configurable with `style`"
    - behavior: "Source maps"
      jigyll: "Not generated"
      jekyll: "Configurable; generated by default"
    - behavior: "Additional load paths"
      jigyll: "Unsupported"
      jekyll: "Supports `load_paths`"
    - behavior: "Sass warning and deprecation controls"
      jigyll: "Unsupported"
      jekyll: "Supports `quiet_deps`, `verbose`, and deprecation options"
    - behavior: "CoffeeScript"
      jigyll: "Never compiled"
      jekyll: "Available through `jekyll-coffeescript`"
    - behavior: "Sass runtime"
      jigyll: "External Dart Sass executable"
      jekyll: "`sass-embedded` dependency"

static-files:
  status: modified
  summary: "Front-matter `defaults` never apply to static files — only the
            five built-in metadata fields are available, so filter on `path`
            instead of custom flags."

structure:
  status: modified
  summary: "No `.jekyll-cache`, `.sass-cache`, or `.jekyll-metadata` — the
            build cache lives in `jigyll-$USER` under the system temp dir,
            and `jigyll serve` renders in memory without writing `_site`."

variables:
  status: modified
  summary: "`jekyll.version` reports the Jigyll version, `page.dir` and the
            `theme.*` variables don't exist, `page.next`/`previous` are
            posts-only, and `site.related_posts` is simply the ten most
            recent posts."

permalinks:
  status: modified
  summary: "Global `permalink: pretty` also applies to implicit ordinary HTML
            pages; other global styles and custom global patterns apply only to
            posts. Unknown placeholders are build errors, and several date
            placeholders (`:week`, weekday names) plus the `weekdate` style are
            missing. Custom front-matter keys work as placeholders."

themes:
  status: modified
  summary: "Themes resolve from a local `_theme/<name>` folder or Bundler.
            `remote_theme` supports only pinned GitHub
            `owner/repository@40-character-SHA` archives; branches, tags,
            URLs, and full plugin behavior remain unsupported. Theme `_data`,
            theme config, and `theme.*` variables are ignored."

liquid:
  status: modified
  summary: "Undefined filters and tags are build errors; undefined variables
            render as empty. `find` and `find_exp` are missing. Jigyll adds
            Shopify-style money filters (`money`, `money_with_currency`, …)
            that Jekyll doesn't have."

pagination:
  status: modified
  summary: "jekyll-paginate (v1) is implemented: `paginate` and
            `paginate_path` split the posts list across copies of the
            `index.html` they point at. Page URLs are directory-normalized
            (`/page2/`, not `/page2`), and jekyll-paginate-v2 features
            (`pagination:` block, category/tag pages) are not supported."

plugins:
  status: replaced
  summary: "There is no extensible plugin system — plugins are Go code compiled
            into the binary. A fixed set of popular plugins is emulated; list
            them in `_config.yml` under `plugins:`, not a Gemfile."

upgrading:
  status: replaced
  summary: "Upgrades come through your package manager (Homebrew, Scoop,
            Docker, the install script, or `go install`) — there is no Bundler
            or `gem update`."
  details: /docs/differences/#replaced

differences:
  status: jigyll-only
  summary: "This page has no Ruby Jekyll counterpart — it aggregates every
            known divergence from the compatibility metadata that powers these
            callouts."

compatibility-roadmap:
  status: jigyll-only
  summary: "This page tracks the work and verification gates required for
            explicit GitHub Pages and Ruby Jekyll compatibility profiles."
