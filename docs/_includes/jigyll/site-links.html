{% capture site_links %}
<!-- docifly-search-exclude:start -->
<footer class="jigyll-site-links" aria-label="Site links">
  <div class="jigyll-site-links-actions not-content">
  {% if page.path %}
  {% capture edit_url %}{{ site.site_links.edit_base_url }}{{ page.path }}{% endcapture %}
  <a href="{{ edit_url | escape }}">Edit this page on GitHub</a>
  {% endif %}
  <a href="#page-title">Back to top</a>
  </div>
  <p>{{ site.site_links.attribution }}</p>
</footer>
<!-- docifly-search-exclude:end -->
{% endcapture %}
{{ site_links | strip_newlines }}
