title: Jigyll
description: A fast, partially-compatible Jekyll clone written in Go.
url: https://jigyll.r2ware.app
baseurl: ""
repository: reidransom/jigyll

theme: docifly
navigation:
  - label: Jigyll
    link: /
  - label: Getting Started
    items:
      - label: Documentation
        link: /docs/
      - label: Installation
        link: /docs/installation/
      - label: Start a New Site
        link: /docs/new/
  - label: Build
    items:
      - label: Command-Line Usage
        link: /docs/usage/
      - label: Configuration
        link: /docs/configuration/
      - label: Localization
        link: /docs/localization/
      - label: Rendering Process
        link: /docs/rendering-process/
      - label: Benchmarks
        link: /docs/benchmarks/
  - label: Content
    items:
      - label: Pages
        link: /docs/pages/
      - label: Posts
        link: /docs/posts/
      - label: Front Matter
        link: /docs/front-matter/
      - label: Collections
        link: /docs/collections/
      - label: Data Files
        link: /docs/datafiles/
      - label: Assets
        link: /docs/assets/
      - label: Static Files
        link: /docs/static-files/
  - label: Site Structure
    items:
      - label: Directory Structure
        link: /docs/structure/
      - label: Liquid
        link: /docs/liquid/
      - label: Variables
        link: /docs/variables/
      - label: Includes
        link: /docs/includes/
      - label: Layouts
        link: /docs/layouts/
      - label: Permalinks
        link: /docs/permalinks/
      - label: Themes
        link: /docs/themes/
      - label: Pagination
        link: /docs/pagination/
      - label: Static Documentation Exports
        link: /docs/static-documentation/
  - label: Guides
    items:
      - label: Plugins
        link: /docs/plugins/
      - label: Upgrading
        link: /docs/upgrading/
  - label: Compatibility
    items:
      - label: Differences from Jekyll
        link: /docs/differences/
      - label: GitHub Pages Compatibility Roadmap
        link: /docs/compatibility-roadmap/
permalink: pretty

plugins:
  - jekyll-github-metadata
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

site_links:
  edit_base_url: https://github.com/reidransom/jigyll/edit/main/docs/
  attribution: ''

collections:
  docs:
    output: true
    permalink: /docs/:path/

defaults:
  - scope:
      path: "_docs"
      type: docs
    values:
      layout: docs

exclude:
  - README.md
  - .servd.toml
  - AGENTS.md
