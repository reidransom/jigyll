name: golangci-lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: golangci-lint
        uses: https://github.com/golangci/golangci-lint-action@v7
        with:
          # golangci-lint v2 is required to lint code targeting Go 1.25;
          # the v1 line (last v1.64.8) is built with go1.24 and rejects it.
          version: v2.6.2
          args: --timeout=30m --issues-exit-code=1
          skip-cache: true
          github-token: ''
