name: docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v* tag to publish; leave empty for a build-only run'
        required: false
        type: string

jobs:
  push:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
      options: --user 0
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Checkout
        id: checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || forgejo.ref }}

      - name: Verify Docker access
        run: docker version

      - name: Set up QEMU
        uses: https://github.com/docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: forgejo.event_name == 'push' || (inputs.release_tag || '') != ''
        uses: https://github.com/docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # docker/metadata-action queries the GitHub repository API. Generate the
      # same image tags locally instead of treating Forgejo as GitHub.
      - name: Docker metadata
        id: meta
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_tag || forgejo.ref_name }}
          PUBLISH_RELEASE: ${{ forgejo.event_name == 'push' || (inputs.release_tag || '') != '' }}
        run: |
          version=develop
          tags=reidransom/jigyll:develop
          if [ "$PUBLISH_RELEASE" = true ]; then
            version="${RELEASE_REF#v}"
            version="${version%%+*}"
            tags="reidransom/jigyll:$version"
            if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
              tags="$tags,reidransom/jigyll:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            fi
            tags="$tags,reidransom/jigyll:latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64,linux/arm64
          # Dispatch publishes only when an existing release tag is selected.
          push: ${{ forgejo.event_name == 'push' || (inputs.release_tag || '') != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://src.r2ware.dev/reid/jigyll
            org.opencontainers.image.url=https://src.r2ware.dev/reid/jigyll
            org.opencontainers.image.title=jigyll
            org.opencontainers.image.description=Go clone of the Jekyll static site generator
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.checkout.outputs.commit }}
          github-token: ''
