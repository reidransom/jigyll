version: 2
project_name: jigyll
force_token: gitea
gitea_urls:
  api: https://src.r2ware.dev/api/v1
  download: https://src.r2ware.dev
release:
  gitea:
    owner: reid
    name: jigyll
before:
  hooks:
    - go mod tidy
    - go test ./...
builds:
  - id: jigyll
    binary: jigyll
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarm:
      - "5"
      - "6"
      - "7"
    goamd64:
      - "v1"
      - "v2"
      - "v3"
    goarch:
      - "amd64"
      - "arm64"
      - "arm"
      - "riscv64"
    ignore:
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: riscv64
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: riscv64
    ldflags: -s -w -X github.com/reidransom/jigyll/version.Version={{.Version}} -X github.com/reidransom/jigyll/version.BuildDate={{ time "2006-01-02T15:04:05-0700" }}

archives:
  - id: default
    ids:
      - jigyll
    formats:
      - tar.gz
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
      {{- if .Amd64 }}{{ .Amd64 }}{{ end }}
    # use zip for windows archives
    format_overrides:
    - goos: windows
      formats:
        - zip
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
brews:
  - name: jigyll
    ids:
      - default
    repository:
      owner: reidransom
      name: homebrew-tap
      branch: main
    # OSS GoReleaser cannot use a GitHub API client alongside a Gitea release.
    # scripts/publish-package-manifests.py publishes the generated files instead.
    skip_upload: true
    url_template: "https://src.r2ware.dev/reid/jigyll/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    directory: Formula
    homepage: "https://src.r2ware.dev/reid/jigyll"
    description: "Go clone of the Jekyll static site generator"
    license: "MIT"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # dart-sass provides the `sass` binary that jigyll resolves from PATH for SCSS.
    dependencies:
      - name: dart-sass
    install: |
      bin.install "jigyll"
    test: |
      system "#{bin}/jigyll", "version"
scoops:
  - name: jigyll
    ids:
      - default
    repository:
      owner: reidransom
      name: scoop-bucket
      branch: main
    skip_upload: true
    url_template: "https://src.r2ware.dev/reid/jigyll/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    directory: bucket
    homepage: "https://src.r2ware.dev/reid/jigyll"
    description: "Go clone of the Jekyll static site generator"
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # Scoop's `sass` package (main bucket) is Dart Sass; it puts `sass` on PATH,
    # which jigyll resolves at runtime for SCSS. (There is no `dart-sass` package
    # in Scoop — that name only appears as a binary alias of `sass`.)
    depends:
      - main/sass
